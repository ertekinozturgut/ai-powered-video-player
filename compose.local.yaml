name: videoatlas-local
services:
  app:
    build:
      context: .
      target: ${VIDEOATLAS_DOCKER_TARGET:-final}
    image: videoatlas:local-test
    ports:
      - "127.0.0.1:${VIDEOATLAS_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Storage__Root: /data
      Accounts__AllowRegistration: "true"
      AllowedHosts: "localhost;127.0.0.1"
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__ChatModel: ${AI_CHAT_MODEL:-gpt-4o-mini}
      ProviderCredentials__OpenRouter: ${OPENROUTER_API_KEY:-}
      ProviderCredentials__ElevenLabs: ${ELEVENLABS_API_KEY:-}
    volumes:
      - local_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=1024m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
volumes:
  local_data:
